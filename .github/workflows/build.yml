name: Build

on:
  push:
    paths:
      - '**.m'
      - '**.mm'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    name: Build libsupport
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: ⬇️ Lấy code dự án
        uses: actions/checkout@v4

      - name: ⚡ Cài Make + Theos
        run: |
          brew install make
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$THEOS/bin:$PATH" >> $GITHUB_PATH
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: 🔨 Build
        run: |
          make clean
          make -j$(sysctl -n hw.ncpu)

      - name: 📦 Lấy file kết quả
        uses: actions/upload-artifact@v4
        with:
          name: libsupport-dylib
          path: .theos/obj/**/*.dylib
          retention-days: 7
