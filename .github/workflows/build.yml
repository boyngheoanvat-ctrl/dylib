name: Build

on:
  push:
    paths:
      - '**.m'
      - '**.mm'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    name: Build libsupport
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: ⬇️ Lấy code dự án
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚡ Cài Make + Theos ĐẦY ĐỦ
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV
          # Clone Theos bao gồm cả submodule/vendor
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          # Cập nhật nếu cần
          $HOME/theos/bin/update-theos

      - name: 🔨 Build
        env:
          THEOS: $HOME/theos
        run: |
          export THEOS=$HOME/theos
          export THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes
          gnumake clean
          gnumake -j$(sysctl -n hw.ncpu)

      - name: 📦 Lấy file kết quả
        uses: actions/upload-artifact@v4
        with:
          name: libsupport-dylib
          path: .theos/obj/**/*.dylib
          retention-days: 7
