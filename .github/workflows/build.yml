name: Build liberi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid & fix config
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64" -o $HOME/theos/bin/ldid
          chmod +x $HOME/theos/bin/ldid
          mkdir -p $HOME/.theos
          echo 'TARGET_CODESIGN_FLAGS = -s' >> $HOME/.theosrc

      - name: Update Theos
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos

      - name: Build project
        run: |
          export THEOS=$HOME/theos
          make clean
          make

      - name: Tìm file dylib — xem nó ở đâu
        run: |
          find .theos -name "liberi.dylib" -type f
          ls -R .theos/obj/

      - name: Upload dylib — ĐÚNG ĐƯỜNG DẪN
        uses: actions/upload-artifact@v4
        with:
          name: liberi.dylib
          path: .theos/obj/debug/arm64/liberi.dylib
