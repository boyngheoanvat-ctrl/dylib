name: Build iOS Dylib

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest # Sử dụng macOS để có sẵn toolchain và SDK chính hãng
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Dylib
        env:
          THEOS: /Users/runner/theos # Đường dẫn Home trên macOS
        run: |
          make clean
          make
