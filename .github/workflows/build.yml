name: Build liberi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Theos & ldid
        run: |
          # Cài Theos
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # Tải ldid đã biên dịch sẵn — nhanh & không cần đăng nhập
          curl -L "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus1/ldid-macos-universal" -o $HOME/ldid
          chmod +x $HOME/ldid
          echo "$HOME" >> $GITHUB_PATH

      - name: Update Theos
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos

      - name: Build project
        run: |
          export THEOS=$HOME/theos
          export PATH="$HOME:$PATH"
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: liberi.dylib
          path: .theos/obj/arm64/liberi.dylib
