name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Theos + Tải SDK tự động
        run: |
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          
          # Tải iOS SDK cần thiết
          cd /opt/theos
          curl -L https://github.com/theos/sdks/releases/download/2024-06-14/iPhoneOS15.0.sdk.tar.xz | tar xJ

      - name: Sửa lỗi gói + cài công cụ
        run: |
          sed -i 's/lzma/gzip/g' /opt/theos/makefiles/package/deb.mk
          sudo apt-get update
          sudo apt-get install -y libio-compress-lzma-perl build-essential git

      - name: Biên dịch
        run: |
          export THEOS=/opt/theos
          make clean
          make

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
