name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài công cụ hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget curl

      - name: Cài Theos + cập nhật đầy đủ
        run: |
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          cd /opt/theos
          # Chạy lệnh cập nhật chính thức của Theos → tải vendor/include + vendor/lib
          ./bin/update-theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Tải SDK & đặt đúng tên
        run: |
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          
          wget -L "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" -O sdks.tar.gz
          tar -xzf sdks.tar.gz --strip-components=1
          rm sdks.tar.gz
          
          # Đổi tên SDK khớp với Makefile
          mv -f iPhoneOS15.6.sdk iPhoneOS15.0.sdk
          
          ls -la
          echo "✅ Sẵn sàng biên dịch"

      - name: Sửa lỗi gói
        run: |
          sed -i 's/lzma/gzip/g' /opt/theos/makefiles/package/deb.mk
          sudo apt-get install -y libio-compress-lzma-perl

      - name: Biên dịch
        run: |
          export THEOS=/opt/theos
          make clean
          make

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
