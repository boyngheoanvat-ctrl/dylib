name: Build liberi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid — cách chắc chắn
        run: |
          # Cách 1: Tải trực tiếp từ nguồn Theos
          curl -fsSL "https://raw.githubusercontent.com/theos/theos/master/bin/ldid" -o $HOME/ldid
          chmod +x $HOME/ldid
          echo "$HOME" >> $GITHUB_PATH
          
          # Kiểm tra
          ls -la $HOME/ldid
          file $HOME/ldid

      - name: Update Theos
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos

      - name: Build project
        run: |
          export THEOS=$HOME/theos
          export PATH="$HOME:$PATH"
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: liberi.dylib
          path: .theos/obj/arm64/liberi.dylib
