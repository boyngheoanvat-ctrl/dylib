name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài công cụ hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget libxml2-dev libplist-dev

      - name: Cài Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Tải SDK với link chính xác
        run: |
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          
          # Link từ Releases đã được xác nhận
          wget -L "https://github.com/theos/sdks/releases/download/2024-06-14/iPhoneOS15.0.sdk.tar.xz" -O sdk.tar.xz
          
          # Kiểm tra kích thước
          ls -lh sdk.tar.xz
          
          # Giải nén
          tar -xf sdk.tar.xz
          rm sdk.tar.xz
          
          ls -la
          echo "✅ SDK sẵn sàng"

      - name: Sửa lỗi gói
        run: |
          sed -i 's/lzma/gzip/g' /opt/theos/makefiles/package/deb.mk
          sudo apt-get install -y libio-compress-lzma-perl

      - name: Biên dịch
        run: |
          export THEOS=/opt/theos
          make clean
          make

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
