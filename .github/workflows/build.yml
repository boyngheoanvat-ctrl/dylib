name: Build dylib — Theos
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Theos
        run: |
          export THEOS=$HOME/theos
          git clone --depth=1 https://github.com/theos/theos.git $THEOS
          
          # Đặt biến TRƯỚC khi chạy update
          cd $THEOS
          $THEOS/bin/update-theos
          
          # Lưu biến cho bước sau
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          # Tắt thông báo build chậm
          mkdir -p $HOME/.config/theos
          echo 'THEOS_IGNORE_PARALLEL_BUILDING_NOTICE = yes' >> $HOME/.config/theos/rc.mk

      - name: Kiểm tra
        run: |
          echo "THEOS=$THEOS"
          ls -la $THEOS/vendor/

      - name: Build
        run: |
          make clean
          make

      - name: Tải .dylib
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu
          path: |
            ./*.dylib
            ./obj/*.dylib
          retention-days: 14
