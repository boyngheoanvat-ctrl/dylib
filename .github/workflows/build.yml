name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài công cụ
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget libxml2-dev libplist-dev

      - name: Cài Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Tải SDK & lấy tên chính xác
        run: |
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          
          wget -L "https://github.com/theos/sdks/archive/refs/heads/master.tar.gz" -O sdks.tar.gz
          
          # Liệt kê toàn bộ SDK có sẵn
          tar -tf sdks.tar.gz | grep -E "iPhoneOS.*\.sdk/$"
          
          # Giải nén toàn bộ
          tar -xzf sdks.tar.gz --strip-components=1
          rm sdks.tar.gz
          
          # Lấy tên SDK mới nhất
          SDK_NAME=$(ls -d /opt/theos/sdks/iPhoneOS*.sdk | xargs basename)
          echo "FOUND_SDK=$SDK_NAME" >> $GITHUB_ENV
          echo "✅ Tìm thấy SDK: $SDK_NAME"

      - name: Cập nhật Makefile khớp SDK
        run: |
          # Thay đổi tên SDK trong Makefile nếu cần
          if [ -f Makefile ]; then
            sed -i "s/iPhoneOS[0-9.]*\.sdk/$FOUND_SDK/" Makefile
            echo "✅ Đã cập nhật Makefile dùng $FOUND_SDK"
          fi
          cat Makefile

      - name: Sửa lỗi gói
        run: |
          sed -i 's/lzma/gzip/g' /opt/theos/makefiles/package/deb.mk
          sudo apt-get install -y libio-compress-lzma-perl

      - name: Biên dịch
        run: |
          export THEOS=/opt/theos
          export THEOS_SDK_NAME=$FOUND_SDK
          make clean
          make

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
