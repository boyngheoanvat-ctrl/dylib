name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Sửa lỗi dm.pl + nén
        run: |
          # Sửa deb.mk dùng gzip thay vì lzma
          sed -i 's/_THEOS_PLATFORM_DPKG_DEB_COMPRESSION ?= lzma/_THEOS_PLATFORM_DPKG_DEB_COMPRESSION ?= gzip/' /opt/theos/makefiles/package/deb.mk
          # Cài module Perl cần thiết
          sudo apt-get update && sudo apt-get install -y libio-compress-lzma-perl

      - name: Cài công cụ biên dịch
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential git bison flex libplist-dev libxml2-dev

      - name: Biên dịch (chỉ build, không gói deb)
        run: |
          export THEOS=/opt/theos
          make clean
          make # ← Chỉ tạo .dylib, bỏ qua package gây lỗi

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
