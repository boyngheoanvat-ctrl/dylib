name: Build iOS Dylib

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          # Xóa sạch thư mục theos cũ để tránh xung đột dữ liệu
          rm -rf ~/theos
          
          # Clone mới hoàn toàn Theos kèm submodule và SDKs
          git clone --recursive https://github.com/theos/theos.git ~/theos
          git clone https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Dylib
        env:
          THEOS: /home/runner/theos
        run: |
          make clean
          make
