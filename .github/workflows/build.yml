name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/itsnep/theos:latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Biên dịch
        run: |
          export THEOS=/theos
          make clean
          make

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
