name: Build iOS .dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build for iOS .dylib
    runs-on: macos-latest  # ✅ Phải chạy trên macOS mới ra .dylib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build .dylib
        run: |
          mkdir -p build && cd build
          
          # Biên dịch cho ARM64 iOS
          clang++ -c -arch arm64 -std=c++17 \
            -I../src/main/jni/Includes \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -fPIC \
            ../src/main/jni/Main.cpp \
            ../src/main/jni/Includes/A64Hook.cpp

          # Tạo thư viện .dylib
          clang++ -dynamiclib -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -o libmodmenu.dylib \
            *.o

          ls -lh libmodmenu.dylib

      - name: Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-iOS-dylib
          files: build/libmodmenu.dylib
          retention-days: 14
