name: Build liberi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid + Fix Theos config
        run: |
          # Tải ldid chính xác
          curl -L "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64" -o $HOME/theos/bin/ldid
          chmod +x $HOME/theos/bin/ldid
          
          # === QUAN TRỌNG: Sửa cấu hình Theos ===
          # Bỏ yêu cầu entitlements rỗng → ký trực tiếp
          echo 'TARGET_CODESIGN = $(THEOS)/bin/ldid' >> $HOME/.theosrc
          echo 'TARGET_CODESIGN_FLAGS = -S' >> $HOME/.theosrc
          
          # Kiểm tra
          $HOME/theos/bin/ldid -V

      - name: Update Theos
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos

      - name: Build project
        run: |
          export THEOS=$HOME/theos
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: liberi.dylib
          path: .theos/obj/arm64/liberi.dylib
