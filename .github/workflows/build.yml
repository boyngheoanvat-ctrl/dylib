name: Build liberi

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Theos & tools
        run: |
          # Cài Theos
          git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # Cài ldid — công cụ ký
          git clone --depth 1 https://github.com/kevinbrook/ldid.git $HOME/ldid
          cd $HOME/ldid && make install PREFIX=$HOME
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Update Theos
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/update-theos

      - name: Build project
        run: |
          export THEOS=$HOME/theos
          export PATH="$HOME/bin:$PATH"
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: liberi.dylib
          path: .theos/obj/arm64/liberi.dylib
