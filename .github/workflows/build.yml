name: Build iOS Dylib

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dependencies & Theos
        run: |
          brew install ldid
          rm -rf ~/theos
          git clone --recursive https://github.com/theos/theos.git ~/theos
          rm -rf ~/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git ~/theos/sdks

      - name: Build Dylib
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean
          make

      # Bước mới: Đưa file dylib lên mục Artifacts để tải về
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eri-dylib
          path: .theos/obj/debug/eri.dylib # Hoặc kiểm tra đường dẫn file dylib nếu nó xuất ra ở thư mục gốc
