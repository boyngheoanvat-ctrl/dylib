name: Build dylib — Tìm ra file
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài ldid + Theos
        run: |
          brew install ldid
          
          export THEOS=$HOME/theos
          git clone --depth=1 https://github.com/theos/theos.git $THEOS || true
          
          cd $THEOS
          $THEOS/bin/update-theos
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          mkdir -p $HOME/.config/theos
          echo 'THEOS_IGNORE_PARALLEL_BUILDING_NOTICE = yes' >> $HOME/.config/theos/rc.mk

      - name: Build + Liệt kê TẤT CẢ
        run: |
          make clean
          make
          
          echo "=== 🔍 TÌM TẤT CẢ .dylib ==="
          find "$PWD" -name "*.dylib" -type f
          
          echo "=== 📂 Cấu trúc thư mục ==="
          ls -la
          
          echo "=== 📂 Thư mục .theos ==="
          ls -laR .theos/ 2>/dev/null || echo "Không có .theos"
          
          echo "=== 📂 Thư mục obj ==="
          ls -laR obj/ 2>/dev/null || echo "Không có obj"

      - name: Tải file — mọi vị trí
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu
          path: |
            *.dylib
            .theos/**/*.dylib
            obj/**/*.dylib
            $PWD/**/*.dylib
          retention-days: 14
