name: Build dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build .dylib
    runs-on: macos-latest  # ✅ Bắt buộc macOS cho .dylib

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra file
        run: |
          echo "=== File trong thư mục ==="
          ls -la
          echo "=== Có Makefile không? ==="
          test -f Makefile && echo "✅ Có Makefile" || echo "❌ Không thấy Makefile"

      - name: Build với Makefile
        run: |
          make clean 2>/dev/null || true
          make
          echo "=== Kết quả sau build ==="
          ls -lh *.dylib 2>/dev/null || ls -lh

      - name: Upload .dylib
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu.dylib
          path: |
            *.dylib
            !Makefile
            !README.md
          retention-days: 14
