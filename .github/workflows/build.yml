name: Build

# Tự chạy khi đẩy code hoặc bấm nút thủ công
on:
  push:
    paths:
      - '**.m'
      - '**.mm'
      - 'Makefile'
  workflow_dispatch:

# Tối ưu tốc độ
jobs:
  build:
    name: Build libsupport
    runs-on: macos-15  # macOS mới nhất → nhanh nhất
    timeout-minutes: 5  # Giới hạn 5 phút là đủ

    steps:
      - name: ⬇️ Lấy code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Chỉ lấy phiên bản mới → nhanh

      - name: ⚡ Cài Make mới + Theos
        run: |
          brew install make
          echo "PATH=/usr/local/opt/make/libexec/gnubin:\$PATH" >> $GITHUB_ENV
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos

      - name: 🔨 Build
        run: |
          export THEOS=$HOME/theos
          export THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes
          make clean
          make -j$(sysctl -n hw.ncpu)  # Dùng TẤT CẢ lõi CPU → cực nhanh

      - name: 📦 Lấy file kết quả
        uses: actions/upload-artifact@v4
        with:
          name: libsupport-dylib
          path: .theos/obj/**/*.dylib
          retention-days: 7  # Giữ file 7 ngày
