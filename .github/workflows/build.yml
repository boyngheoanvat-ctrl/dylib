name: Build dylib — Theos
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài ldid + Theos
        run: |
          brew install ldid
          
          export THEOS=$HOME/theos
          git clone --depth=1 https://github.com/theos/theos.git $THEOS || true
          
          cd $THEOS
          $THEOS/bin/update-theos
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          mkdir -p $HOME/.config/theos
          echo 'THEOS_IGNORE_PARALLEL_BUILDING_NOTICE = yes' >> $HOME/.config/theos/rc.mk

      - name: Build
        run: |
          make clean
          make

      - name: Tải .dylib
        uses: actions/upload-artifact@v4
        with:
          name: libmodmenu
          path: |
            ./*.dylib
            ./obj/*.dylib
          retention-days: 14
