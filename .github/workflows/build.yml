name: Build Mod

on:
  push:
    paths:
      - '**.mm'
      - 'Makefile'
  workflow_dispatch:

jobs:
  build:
    name: Build libsupport
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: ⬇️ Lấy code
        uses: actions/checkout@v4

      - name: ⚡ Cài Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: 🔨 Build
        run: |
          make clean
          make -j$(sysctl -n hw.ncpu)

      - name: 📦 Tải kết quả
        uses: actions/upload-artifact@v4
        with:
          name: libsupport
          path: .theos/obj/**/*.dylib
          retention-days: 7
