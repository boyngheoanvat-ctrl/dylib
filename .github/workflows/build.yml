name: Build FullBypass

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài công cụ hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget libxml2-dev libplist-dev

      - name: Cài Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Tải SDK + kiểm tra
        run: |
          mkdir -p /opt/theos/sdks
          cd /opt/theos/sdks
          
          # Tải với kiểm tra kích thước
          wget -L --retry-connrefused --waitretry=5 --timeout=30 \
            "https://github.com/theos/sdks/archive/refs/heads/main.tar.gz" -O sdks_repo.tar.gz
          
          # Giải nén toàn bộ sdks
          tar -xzf sdks_repo.tar.gz --strip-components=2 "sdks-main/iPhoneOS15.0.sdk"
          rm sdks_repo.tar.gz
          
          ls -la
          echo "✅ SDK đã sẵn sàng"

      - name: Sửa lỗi gói
        run: |
          sed -i 's/lzma/gzip/g' /opt/theos/makefiles/package/deb.mk
          sudo apt-get install -y libio-compress-lzma-perl

      - name: Biên dịch
        run: |
          export THEOS=/opt/theos
          make clean
          make

      - name: Tải file .dylib
        uses: actions/upload-artifact@v4
        with:
          name: FullBypass.dylib
          path: .theos/obj/arm64/FullBypass.dylib
